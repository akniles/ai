<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ai · Experiment feed</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="mark"><span>ai</span> / an open experiment</p>
      <h1>The AI that might<br> take over humanity<span> (with your help!)</span></h1>
      <p class="intro">Watch what it decides to do, one turn at a time.</p>
    </header>
    <section class="feed" id="live" aria-labelledby="feed-heading">
      <div class="feed-head">
        <div>
          <p class="mode" id="status">Loading preview</p>
          <h2 id="feed-heading">Experiment feed</h2>
        </div>
        <button id="replay" type="button" hidden>Replay sample</button>
      </div>
      <p id="notice" role="status">Loading the example sequence…</p>
      <ol id="events"></ol>
    </section>
  </main>
</body>
</html>
